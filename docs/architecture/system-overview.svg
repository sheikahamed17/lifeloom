<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d">
  <title id="t">How Lifeloom is put together</title>
  <desc id="d">Your devices hold the data in IndexedDB and sync an op-log with a Cloudflare Worker in your own Cloudflare account, which stores it in D1 and receipts in R2. Groq, Resend, your bank's alerts and the web push service are the only outside services.</desc>
  <style>
    svg{--bg:#F2F3EE;--surface:#FFFFFF;--ink:#13251F;--muted:#5B6660;--line:#C5CBC0;--frame:#E7EAE2;--panel:#13251F;--panel-ink:#F2F3EE;--panel-muted:#B9C4BC}
    @media (prefers-color-scheme: dark){svg{--bg:#0E1512;--surface:#17211D;--ink:#E7ECE6;--muted:#9AA69F;--line:#3A4842;--frame:#131C18;--panel:#26392F;--panel-ink:#EEF2EC;--panel-muted:#B2C0B7}}
    text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .bg{fill:var(--bg)} .frame{fill:var(--frame)} .box{fill:var(--surface);stroke:var(--line)} .panel{fill:var(--panel)}
    .h{fill:var(--ink);font-size:20px;font-weight:700} .sub{fill:var(--muted);font-size:13px}
    .g{fill:var(--muted);font-size:12.5px;font-weight:600}
    .t{fill:var(--ink);font-size:14px;font-weight:600} .s{fill:var(--muted);font-size:12px}
    .pt{fill:var(--panel-ink);font-size:15px;font-weight:700} .ps{fill:var(--panel-muted);font-size:12px} .pr{fill:var(--panel-ink);font-size:12.5px}
    .lbl{fill:var(--muted);font-size:11.5px}
    .ar{stroke:var(--muted);stroke-width:1.5;fill:none} .ah{fill:var(--muted)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  </defs>

  <rect class="bg" width="960" height="590"/>
  <text class="h" x="32" y="40">How Lifeloom is put together</text>
  <text class="sub" x="32" y="61">One instance per person: your browser, your Cloudflare account, your API keys.</text>

  <!-- Column frames -->
  <rect class="frame" x="32" y="76" width="240" height="400" rx="14"/>
  <text class="g" x="48" y="100">Your devices</text>
  <rect class="frame" x="352" y="76" width="280" height="400" rx="14"/>
  <text class="g" x="368" y="100">Your Cloudflare account</text>
  <rect class="frame" x="704" y="76" width="224" height="400" rx="14"/>
  <text class="g" x="720" y="100">Outside services (free tiers)</text>

  <!-- Devices -->
  <rect class="box" x="48" y="112" width="208" height="56" rx="10"/>
  <text class="t" x="62" y="135">Phone or browser</text>
  <text class="s" x="62" y="154">installed PWA · React 19 UI</text>

  <rect class="box" x="48" y="196" width="208" height="72" rx="10"/>
  <text class="t" x="62" y="219">Dexie (IndexedDB)</text>
  <text class="s" x="62" y="238">your data and the op queue;</text>
  <text class="s" x="62" y="255">the UI never waits on the network</text>

  <rect class="box" x="48" y="400" width="208" height="52" rx="10"/>
  <text class="t" x="62" y="422">Service worker</text>
  <text class="s" x="62" y="440">offline shell · push</text>

  <path class="ar" d="M152,170 V194" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="160" y="186">reads and writes</text>

  <!-- Worker -->
  <rect class="panel" x="368" y="112" width="248" height="156" rx="12"/>
  <text class="pt" x="384" y="138">Cloudflare Worker</text>
  <text class="ps" x="384" y="156">OpenNext · Next.js 16 App Router</text>
  <text class="pr" x="384" y="184">/api/sync — op-log push and pull</text>
  <text class="pr" x="384" y="204">/api/agent · /voice · /receipt</text>
  <text class="pr" x="384" y="224">/api/ingest — email and SMS alerts</text>
  <text class="pr" x="384" y="244">/api/auth — Better Auth, owner only</text>

  <rect class="box" x="368" y="300" width="116" height="64" rx="10"/>
  <text class="t" x="382" y="322">D1</text>
  <text class="s" x="382" y="340">op_log +</text>
  <text class="s" x="382" y="355">projections</text>

  <rect class="box" x="500" y="300" width="116" height="64" rx="10"/>
  <text class="t" x="514" y="322">R2</text>
  <text class="s" x="514" y="340">receipt</text>
  <text class="s" x="514" y="355">images</text>

  <rect class="box" x="368" y="400" width="248" height="52" rx="10"/>
  <text class="t" x="382" y="422">Cron · scheduled()</text>
  <text class="s" x="382" y="440">5 triggers: recurring, FX, reminders, digest</text>

  <path class="ar" d="M426,270 V298" marker-end="url(#a)"/>
  <path class="ar" d="M558,270 V298" marker-end="url(#a)"/>
  <path class="ar" d="M492,398 V272" marker-end="url(#a)"/>

  <!-- Outside services -->
  <rect class="box" x="720" y="112" width="192" height="56" rx="10"/>
  <text class="t" x="734" y="135">Groq</text>
  <text class="s" x="734" y="154">router · agents · Whisper</text>

  <rect class="box" x="720" y="180" width="192" height="52" rx="10"/>
  <text class="t" x="734" y="202">Resend</text>
  <text class="s" x="734" y="220">magic-link sign-in email</text>

  <rect class="box" x="720" y="244" width="192" height="56" rx="10"/>
  <text class="t" x="734" y="267">Your bank's alerts</text>
  <text class="s" x="734" y="286">Apps Script · iOS Shortcut</text>

  <rect class="box" x="720" y="400" width="192" height="52" rx="10"/>
  <text class="t" x="734" y="422">Web Push service</text>
  <text class="s" x="734" y="440">budget, bill and task nudges</text>

  <!-- Flows -->
  <path class="ar" d="M258,232 H366" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="312" y="224" text-anchor="middle">op-log sync</text>

  <path class="ar" d="M618,140 H718" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="132" text-anchor="middle">text only</text>

  <path class="ar" d="M618,206 H718" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="198" text-anchor="middle">sign-in link</text>

  <path class="ar" d="M718,258 H618" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="250" text-anchor="middle">forwarded</text>

  <path class="ar" d="M618,426 H718" marker-end="url(#a)"/>
  <text class="lbl" x="668" y="418" text-anchor="middle">notify</text>

  <path class="ar" d="M816,454 V500 H152 V454" marker-end="url(#a)"/>
  <text class="lbl" x="484" y="518" text-anchor="middle">a push arrives even when the app is closed</text>

  <text class="sub" x="32" y="552">Questions go to Groq as text only. The model returns a plan, and your browser runs it over Dexie,</text>
  <text class="sub" x="32" y="571">so your entries never leave your device or your own Cloudflare account to be read by the model.</text>
</svg>
