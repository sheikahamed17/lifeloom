allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Transitive-dep security floors to clear Dependabot alerts (52 alerts across 12
# packages, 2026-08). Most are dev/build-time tooling (wrangler / miniflare /
# next-build / opennext) not reachable from the deployed Worker runtime, so real
# exposure is local-machine-only — pinned regardless. The COMMITTED lockfile
# freezes exact resolution; these floors only re-resolve on an explicit update.
# brace-expansion & nanoid have MULTIPLE majors live in the tree, so they are
# major-scoped + exact-pinned — an unbounded `>=` would force a `^1` parent up to
# brace-expansion@5 (or nanoid@3 CJS up to nanoid@6 ESM) and break resolution.
# NOTE: pnpm 11 reads overrides ONLY from here, not package.json#pnpm.overrides.
overrides:
  undici: '>=8.12.2'                # 2026-11: raised from >=8.9.0 (17 alerts, high/med/low)
  hono: '>=4.12.34'                 # 7 alerts (med/low)
  '@hono/node-server': '>=1.19.15 <2'  # 1 alert (med) — bound: 2.x is a major bump
  fast-uri: '>=3.1.5 <4'            # 3 alerts (high) — bound: ajv wants 3.x
  ip-address: '>=10.7.4'            # 2026-11: raised from >=10.3.1 (5 alerts, med)
  js-yaml: '>=4.3.1 <5'             # 2 alerts (high) — bound: 5.x is ESM-only
  sharp: '>=0.35.5'                 # 2026-11: raised from >=0.35.0 (librsvg CVE, high)
  body-parser: '>=2.4.0'            # 2026-11: raised from >=2.3.0 (DoS, high)
  postcss: '>=8.5.23'               # 2 alerts (high/med) — was >=8.5.10
  ws: '>=8.21.0'                    # retained pin (not currently flagged)
  esbuild: '>=0.28.1'               # retained pin (not currently flagged)
  'nanoid@3': '3.3.18'              # 2 alerts (high) — exact-pin the 3.x line
  'brace-expansion@1': '1.1.21'     # 2026-11: was 1.1.16 — 5 newer alerts on every major (high/med)
  'brace-expansion@2': '2.1.7'      #   ″ was 2.1.4
  'brace-expansion@5': '5.0.12'     #   ″ was 5.0.9
  # 2026-09 sweep — 3 transitive floors (all single-major in the tree, so plain >= is safe):
  browserslist: '>=4.28.7'          # 2 alerts (high) — child of next/postcss
  baseline-browser-mapping: '>=2.11.0'  # 1 alert (med) — child of browserslist
  qs: '>=6.16.1'                    # 2026-11: raised from >=6.16.0 (med) — only 6.x live
  # 2026-11 sweep — new transitive floors (single-major in the tree unless scoped):
  proxy-addr: '>=2.0.8'             # 1 alert (critical) — IPv4-mapped IPv6 spoofing; child of express
  source-map-js: '>=1.2.2'          # 1 alert (high) — child of postcss / next
  'zod@<4.6.6': '^4.6.7'            # 1 alert (high) — @serwist/build's 4.4.x copy. Version-scoped on purpose:
                                    #   a bare `zod:` override rewrites the DIRECT dep's specifier too, so
                                    #   pnpm-lock.yaml no longer matches package.json and CI's
                                    #   --frozen-lockfile install fails (it did: 1078dcf).
  # 2026-11: GHSA-3g3m-2fjr-6pw4 (med) covers glob 9.0.0–14.0.1 and is fixed only in
  # 14.0.2, so the 10.x (@node-minify/core) and 13.x (OpenNext, @serwist/build,
  # @serwist/next) copies move up a major onto the direct dep's 14.x. Safe because all
  # four only call glob()/globSync() with cwd/ignore/nodir/absolute/follow/
  # withFileTypes/windowsPathsNoEscape; none use what 14 changed (walk(), isRegExp,
  # the debug option, ignore patterns starting with `/`). Major-scoped keys, not a
  # bare `glob:` — the direct dep's ^14.0.3 must not be rewritten (zod trap above).
  'glob@10': '^14.0.3'
  'glob@13': '^14.0.3'
  # vite (5 alerts) is fixed by declaring it as a direct devDependency (^8.3.5): it is
  # only a PEER of vitest, and overrides don't reach auto-installed peers. Don't add
  # a bare `vite:` override back — same specifier-rewrite trap as zod above.
  # Not fixable by override (no patched release on the line in use) — build/lint
  # tooling only, never shipped in the Worker: minimatch 10.x (GHSA-g3hv-75wg-m249,
  # via @ts-morph/common and @typescript-eslint; fix is 11.x only, a major that
  # typescript-eslint doesn't support), deepmerge (fix 4.3.2 is unpublished).
  # Revisit when those parents move up.
