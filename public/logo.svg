<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lifeloom">
  <!-- Lifeloom mark: a 3×3 weave. Warp (vertical) and weft (horizontal) threads interlace in a
       checkerboard; the "under" thread has a transparent gap beside the "over" thread so the
       weave reads on any background. -->
  <defs>
    <linearGradient id="llGrad" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86">
      <stop offset="0" stop-color="#6f7bff"/>
      <stop offset="1" stop-color="#34e6ff"/>
    </linearGradient>
    <!-- warp is UNDER where weft is over: (50,29) (29,50) (71,50) (50,71) -->
    <mask id="llWarpMask">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="43.5" y="22" width="13" height="14" fill="#000"/>
      <rect x="22.5" y="43" width="13" height="14" fill="#000"/>
      <rect x="64.5" y="43" width="13" height="14" fill="#000"/>
      <rect x="43.5" y="64" width="13" height="14" fill="#000"/>
    </mask>
    <!-- weft is UNDER where warp is over: (29,29) (71,29) (50,50) (29,71) (71,71) -->
    <mask id="llWeftMask">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="22" y="22.5" width="14" height="13" fill="#000"/>
      <rect x="64" y="22.5" width="14" height="13" fill="#000"/>
      <rect x="43" y="43.5" width="14" height="13" fill="#000"/>
      <rect x="22" y="64.5" width="14" height="13" fill="#000"/>
      <rect x="64" y="64.5" width="14" height="13" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="url(#llGrad)" stroke-width="9" stroke-linecap="round">
    <g mask="url(#llWarpMask)" opacity="0.9">
      <line x1="29" y1="18" x2="29" y2="82"/>
      <line x1="50" y1="18" x2="50" y2="82"/>
      <line x1="71" y1="18" x2="71" y2="82"/>
    </g>
    <g mask="url(#llWeftMask)">
      <line x1="18" y1="29" x2="82" y2="29"/>
      <line x1="18" y1="50" x2="82" y2="50"/>
      <line x1="18" y1="71" x2="82" y2="71"/>
    </g>
  </g>
</svg>
