<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- App-icon source (rendered to PNG by scripts/gen-icons.mjs). Full-bleed background so the
       same file serves as the maskable icon; the weave sits inside the 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162a"/>
      <stop offset="1" stop-color="#0b0c19"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#34e6ff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#34e6ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#34e6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86">
      <stop offset="0" stop-color="#6f7bff"/>
      <stop offset="1" stop-color="#34e6ff"/>
    </linearGradient>
    <mask id="warpMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="43.5" y="22" width="13" height="14" fill="#000"/>
      <rect x="22.5" y="43" width="13" height="14" fill="#000"/>
      <rect x="64.5" y="43" width="13" height="14" fill="#000"/>
      <rect x="43.5" y="64" width="13" height="14" fill="#000"/>
    </mask>
    <mask id="weftMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="22" y="22.5" width="14" height="13" fill="#000"/>
      <rect x="64" y="22.5" width="14" height="13" fill="#000"/>
      <rect x="43" y="43.5" width="14" height="13" fill="#000"/>
      <rect x="22" y="64.5" width="14" height="13" fill="#000"/>
      <rect x="64" y="64.5" width="14" height="13" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- 100-unit mark scaled ×3.4 and centred: (512 − 340) / 2 = 86 -->
  <g transform="translate(86 86) scale(3.4)" fill="none" stroke="url(#mark)" stroke-width="9" stroke-linecap="round">
    <g mask="url(#warpMask)" opacity="0.9">
      <line x1="29" y1="18" x2="29" y2="82"/>
      <line x1="50" y1="18" x2="50" y2="82"/>
      <line x1="71" y1="18" x2="71" y2="82"/>
    </g>
    <g mask="url(#weftMask)">
      <line x1="18" y1="29" x2="82" y2="29"/>
      <line x1="18" y1="50" x2="82" y2="50"/>
      <line x1="18" y1="71" x2="82" y2="71"/>
    </g>
  </g>
</svg>
