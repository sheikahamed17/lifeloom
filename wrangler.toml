# ⚠️ TEMPLATE CONFIG — intentionally has NO resource IDs.
#
# This file is what the "Deploy to Cloudflare" button reads. Leaving
# `database_id` (and other resource IDs) out is what lets Cloudflare
# provision a FRESH, isolated D1 + R2 in each person's own account on a
# one-click deploy, then write the new IDs back into their clone.
#
# Because of that, DO NOT run a bare `wrangler deploy` against this file for
# the production instance — with no `database_id` it would target a new,
# empty database. Production deploys use `wrangler.prod.toml` (which carries
# the real IDs) via `-c wrangler.prod.toml`; the GitHub Actions deploy
# workflow already does this. See SELF-HOSTING.md.

name = "lifeloom"
main = "worker.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]

# Static assets bundled by OpenNext. The binding "ASSETS" is what the
# OpenNext worker uses internally to serve them. The directory matches
# what OpenNext writes during `pnpm cf:build` (.open-next/assets).
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "lifeloom"
# No `database_id`: provisioned per-deploy by the button. Production's real
# ID lives in wrangler.prod.toml. `migrations_dir` points `wrangler d1
# migrations apply DB` at migrations/ (its default, set explicitly for clarity).
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "lifeloom-receipts"

[observability]
enabled = true

[triggers]
# Phase 1.4: daily recurring-rules materializer
# Phase 2.4: daily ECB fx-rates fetcher (one hour later to avoid overlap)
# Phase 3.1: 15-min due-tasks cache updater
# Phase 3.2: weekly digest (Mon 2:30 AM + Mon 2:30 PM)
crons = ["0 2 * * *", "0 3 * * *", "*/15 * * * *", "30 2 * * 1", "30 14 * * 1"]

# Local-dev notes:
# - `pnpm exec wrangler dev` uses --persist by default for D1 (file under .wrangler/)
# - `pnpm exec wrangler d1 execute lifeloom --remote ...` writes to the cloud DB

# VAPID_PUBLIC_KEY is a Worker *secret* (NOT a var), so this file stays byte-identical
# across self-hosted forks and never conflicts on `git sync`. Set it once per instance:
#   node scripts/generate-vapid-keys.mjs        # prints VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY
#   wrangler secret put VAPID_PUBLIC_KEY         # paste the public key
# The Worker reads env.VAPID_PUBLIC_KEY the same way whether it's a var or a secret.

[vars]
# EMAIL_FROM is the sender for Better Auth magic-link emails (Resend).
# On the free tier without a verified domain, use Resend's shared sender
# `onboarding@resend.dev`, which can only deliver to the Resend account's
# own signup email. To send to any address, verify a domain in Resend and
# change this to e.g. "Lifeloom <login@yourdomain.com>". RESEND_API_KEY is a
# secret (wrangler secret put), NOT here.
EMAIL_FROM = "Lifeloom <onboarding@resend.dev>"
